<svg class="fig" viewBox="0 0 1000 780" role="img" aria-label="System architecture: Linear issues flow to Claude sessions and through the quality pipeline back to Linear; specs are the contract that drives codegen, component IDs, view specs and conformance tests; the app shell hosts the design system, table and views engine, identity and realtime; business core, growth and migration are removable modules; everything rests on the Postgres data layer."><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="currentColor"/></marker></defs><text x="0" y="14" class="t-mono t-mute">BUILD LOOP</text><g class="node "><rect x="0" y="24" width="300" height="96" rx="6" fill="var(--card)" stroke="currentColor" stroke-width="1.2" /><text x="12" y="44" class="t-strong">Linear pipeline</text><text x="12" y="62" class="t-small t-mute">Backlog → Ready for Claude → In Progress</text><text x="12" y="77" class="t-small t-mute">→ In Review → Needs Justin → Done</text><text x="12" y="92" class="t-small t-mute">267 issues · 534 blocking relations</text></g><g class="node "><rect x="350" y="24" width="300" height="96" rx="6" fill="var(--card)" stroke="currentColor" stroke-width="1.2" /><text x="362" y="44" class="t-strong">Claude Code sessions</text><text x="362" y="62" class="t-small t-mute">Orchestrator spawns one session per issue</text><text x="362" y="77" class="t-small t-mute">in its own git worktree, as a character</text><text x="362" y="92" class="t-small t-mute">with scoped tools, MCPs and budget</text></g><g class="node hot"><rect x="700" y="24" width="300" height="96" rx="6" fill="var(--card)" stroke="currentColor" stroke-width="1.2" /><text x="712" y="44" class="t-strong">Quality pipeline</text><text x="712" y="62" class="t-small t-mute">Gate 1 static · Gate 2 three reviewer agents</text><text x="712" y="77" class="t-small t-mute">Gate 3 screenshots + video, 7 widths</text><text x="712" y="92" class="t-small t-mute">Gate 4 edge-case hunter · weekly RC digest</text></g><path d="M300 60 L348 60" fill="none" stroke="currentColor" stroke-width="1.4"  marker-end="url(#ah)"/><text x="324" y="50" text-anchor="middle" class="t-small t-mute lbl">claims Ready for Claude</text><path d="M650 60 L698 60" fill="none" stroke="currentColor" stroke-width="1.4"  marker-end="url(#ah)"/><text x="674" y="50" text-anchor="middle" class="t-small t-mute lbl">opens PR on Forgejo (GitHub mirror)</text><path d="M850 120 L850 150 L150 150 L150 122" fill="none" stroke="currentColor" stroke-width="1.4"  marker-end="url(#ah)"/><text x="500" y="144" text-anchor="middle" class="t-small t-mute lbl">gates pass → In Review → merge; release candidate → Needs Justin</text><text x="0" y="200" class="t-mono t-mute">THE CONTRACT</text><g class="node "><rect x="0" y="210" width="1000" height="62" rx="6" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.6" /><text x="12" y="230" class="t-strong">Spec builder</text><text x="12" y="248" class="t-small t-mute">app.spec.yaml + page.spec.yaml per page: purpose, logic, access, data, integrations, layout, components, states, edge cases · validator blocks PRs without a spec</text></g><path d="M500 120 L500 208" fill="none" stroke="currentColor" stroke-width="1.4"  marker-end="url(#ah)"/><text x="560" y="172" text-anchor="start" class="t-small t-mute lbl">writes and validates specs</text><path d="M930 210 L930 122" fill="none" stroke="currentColor" stroke-width="1.4"  marker-end="url(#ah)"/><text x="920" y="172" text-anchor="end" class="t-small t-mute lbl">conformance, permission and edge-case tests derive from specs</text><text x="0" y="316" class="t-mono t-mute">PRODUCT LAYER</text><g class="node "><rect x="0" y="326" width="250" height="112" rx="6" fill="var(--card)" stroke="currentColor" stroke-width="1.2" /><text x="12" y="346" class="t-strong">Design system</text><text x="12" y="364" class="t-small t-mute">DTCG tokens → CSS variables</text><text x="12" y="379" class="t-small t-mute">Base UI/Radix + Tailwind v4</text><text x="12" y="394" class="t-small t-mute">Storybook · per-tenant themes</text></g><g class="node "><rect x="300" y="326" width="400" height="112" rx="6" fill="var(--card)" stroke="currentColor" stroke-width="1.2" /><text x="312" y="346" class="t-strong">Universal app shell</text><text x="312" y="364" class="t-small t-mute">One React 19 + Vite bundle: web/PWA,</text><text x="312" y="379" class="t-small t-mute">Tauri 2 desktop (Linux/macOS/Windows)</text><text x="312" y="394" class="t-small t-mute">and mobile · multi-window · kiosk</text><text x="312" y="409" class="t-small t-mute">Business, growth, migration as removable modules</text></g><g class="node "><rect x="750" y="326" width="250" height="112" rx="6" fill="var(--card)" stroke="currentColor" stroke-width="1.2" /><text x="762" y="346" class="t-strong">Table &amp; views engine</text><text x="762" y="364" class="t-small t-mute">View model ⊇ Airtable/Notion/ClickUp</text><text x="762" y="379" class="t-small t-mute">compiled to SQL · grid, kanban, calendar,</text><text x="762" y="394" class="t-small t-mute">Gantt, gallery, form, map, chart</text></g><path d="M125 272 L125 324" fill="none" stroke="currentColor" stroke-width="1.4"  marker-end="url(#ah)"/><text x="132" y="302" text-anchor="start" class="t-small t-mute lbl">component IDs</text><path d="M500 272 L500 324" fill="none" stroke="currentColor" stroke-width="1.4"  marker-end="url(#ah)"/><text x="508" y="302" text-anchor="start" class="t-small t-mute lbl">codegen scaffolds pages</text><path d="M875 272 L875 324" fill="none" stroke="currentColor" stroke-width="1.4"  marker-end="url(#ah)"/><text x="882" y="302" text-anchor="start" class="t-small t-mute lbl">view + dashboard specs</text><path d="M250 382 L298 382" fill="none" stroke="currentColor" stroke-width="1.4"  marker-end="url(#ah)"/><text x="274" y="372" text-anchor="middle" class="t-small t-mute lbl">tokens, components</text><path d="M750 382 L702 382" fill="none" stroke="currentColor" stroke-width="1.4"  marker-end="url(#ah)"/><text x="726" y="372" text-anchor="middle" class="t-small t-mute lbl">views in pages</text><text x="0" y="482" class="t-mono t-mute">PLATFORM SERVICES</text><g class="node "><rect x="0" y="492" width="300" height="96" rx="6" fill="var(--card)" stroke="currentColor" stroke-width="1.2" /><text x="12" y="512" class="t-strong">Identity &amp; audiences</text><text x="12" y="530" class="t-small t-mute">Better Auth: passkeys, magic link, OAuth, orgs</text><text x="12" y="545" class="t-small t-mute">can(actor, action, resource) from spec access</text><text x="12" y="560" class="t-small t-mute">customers · staff · partners · admins · agents</text></g><g class="node "><rect x="350" y="492" width="300" height="96" rx="6" fill="var(--card)" stroke="currentColor" stroke-width="1.2" /><text x="362" y="512" class="t-strong">Realtime &amp; multiplayer</text><text x="362" y="530" class="t-small t-mute">Yjs via Hocuspocus: docs, canvas, presence</text><text x="362" y="545" class="t-small t-mute">Electric shapes: live records</text><text x="362" y="560" class="t-small t-mute">one WebSocket · offline queue · multi-window</text></g><g class="node "><rect x="700" y="492" width="300" height="96" rx="6" fill="var(--card)" stroke="currentColor" stroke-width="1.2" stroke-dasharray="5 4"/><text x="712" y="512" class="t-strong">Business modules</text><text x="712" y="530" class="t-small t-mute">Business core: Stripe, own ledger, payroll adapter</text><text x="712" y="545" class="t-small t-mute">Growth: CRM, outreach, social, landing pages</text><text x="712" y="560" class="t-small t-mute">Migration: importers, dry runs, business templates</text></g><path d="M150 490 L150 440" fill="none" stroke="currentColor" stroke-width="1.4"  marker-end="url(#ah)"/><text x="158" y="470" text-anchor="start" class="t-small t-mute lbl">who may see and do what, per page</text><path d="M500 490 L500 440" fill="none" stroke="currentColor" stroke-width="1.4"  marker-end="url(#ah)" marker-start="url(#ahs)"/><text x="508" y="470" text-anchor="start" class="t-small t-mute lbl">presence, CRDT docs, live rows</text><path d="M850 490 L850 440" fill="none" stroke="currentColor" stroke-width="1.4"  marker-end="url(#ah)"/><text x="858" y="470" text-anchor="start" class="t-small t-mute lbl">hosted; toggled per app / tenant</text><path d="M700 540 L652 540" fill="none" stroke="currentColor" stroke-width="1.4"  marker-end="url(#ah)"/><text x="676" y="530" text-anchor="middle" class="t-small t-mute lbl">built on tables + identity</text><text x="0" y="640" class="t-mono t-mute">SOURCE OF TRUTH</text><g class="node "><rect x="0" y="650" width="1000" height="80" rx="6" fill="var(--card)" stroke="currentColor" stroke-width="1.6" /><text x="12" y="670" class="t-strong">Data layer</text><text x="12" y="688" class="t-small t-mute">Postgres 17 with row-level security per tenant · Drizzle schema-as-code · oRPC typed API · ElectricSQL + PGlite local-first · MinIO files · pg-boss jobs · audit log · tsvector + pgvector search</text><text x="12" y="703" class="t-small t-mute">Self-hosted on a Hetzner VPS via Coolify next to Forgejo (mirrored to GitHub imagine-os), Hocuspocus and the orchestrator</text></g><path d="M150 650 L150 590" fill="none" stroke="currentColor" stroke-width="1.4"  marker-end="url(#ah)"/><text x="158" y="628" text-anchor="start" class="t-small t-mute lbl">RLS policies enforce tenancy</text><path d="M500 650 L500 590" fill="none" stroke="currentColor" stroke-width="1.4"  marker-end="url(#ah)"/><text x="508" y="628" text-anchor="start" class="t-small t-mute lbl">Yjs persistence · change streams</text><path d="M850 650 L850 590" fill="none" stroke="currentColor" stroke-width="1.4"  marker-end="url(#ah)"/><text x="858" y="628" text-anchor="start" class="t-small t-mute lbl">ledger, CRM, import tables</text><text x="0" y="768" class="t-small t-mute">Solid arrows: data or control flow, labelled with what moves. Dashed box: optional modules an app can ship without. Tinted band: the spec contract every other box reads.</text></svg>